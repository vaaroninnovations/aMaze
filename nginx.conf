# ==============================================================================
# aMaze Behavioral Suite - Nginx Reverse Proxy Configuration
# ==============================================================================
# Installation on Hostinger VPS (Ubuntu/Debian):
# 1. Copy this file: sudo cp nginx.conf /etc/nginx/sites-available/amaze
# 2. Link site:      sudo ln -s /etc/nginx/sites-available/amaze /etc/nginx/sites-enabled/
# 3. Test config:    sudo nginx -t
# 4. Reload nginx:   sudo systemctl reload nginx
# 5. SSL with certbot: sudo certbot --nginx -d yourdomain.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your domain or VPS IP

    # Allow large video uploads (behavior videos can be hundreds of megabytes)
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Gzip compression for high frontend performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Reverse proxy to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (for live camera tracking & real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long video uploads and processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for real-time video streaming
        proxy_buffering off;
    }

    # Cache static frontend assets directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
